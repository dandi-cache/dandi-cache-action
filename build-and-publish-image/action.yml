name: Build and Publish a DANDI Cache Image
description: Build and publish a DANDI cache's runtime container image.
author: DANDI Cache

branding:
  icon: package
  color: blue

# The container build for every DANDI cache. Tagging is handled here so that a branch build no
# longer overwrites `:latest`, which was the one thing stopping a cache from testing an environment
# change before merging it: `main` publishes `:latest` and the commit SHA, any other branch
# publishes `dev-<branch>` and the SHA, and a pull request only builds, since it has no credentials
# to push with.

inputs:
  token:
    description: "Token used to push the image. Needs `write:packages`."
    required: true
  dockerfile:
    description: "Path to the Dockerfile to build."
    required: false
    default: containers/Dockerfile
  target:
    description: "Build stage to target, for multi-stage Dockerfiles."
    required: false
    default: ""
  mail-username:
    description: "SMTP username for the failure notification. Leave empty to send no mail."
    required: false
    default: ""
  mail-password:
    description: "SMTP password for the failure notification."
    required: false
    default: ""
  notify-to:
    description: "Comma-separated recipients of the failure notification (no spaces)."
    required: false
    default: cody.c.baker.phd@gmail.com
  version-file:
    description: >-
      The TOML file whose `[project] version` names the state of the cache. A pull request that
      changes any of `version-paths` must change this version too. Leave empty to skip the check.
    required: false
    default: envs/pyproject.toml
  version-paths:
    description: >-
      Space-separated paths whose change calls for a version bump: the cache's code, its
      configuration, its environment and its container. A change to anything else, such as the
      workflows or the documentation, does not.
    required: false
    default: "code cache.toml envs/pyproject.toml containers"

outputs:
  tags:
    description: "The comma-separated tags this build was labelled with."
    value: ${{ steps.tags.outputs.list }}

runs:
  using: composite
  steps:
    # Two commits deep, so that on a pull request the merge commit being built still has both of its
    # parents: the version check below compares the pull request against the base it merges into.
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Check the version was bumped
      if: github.event_name == 'pull_request' && inputs.version-file != ''
      shell: bash
      # The version in `version-file` is the one place a cache's state is named, so a change to what
      # the cache runs that keeps the version it had would be indistinguishable from no change. This
      # fails the pull request instead, as `dandi-cache-utils` does for the library. A pull request
      # that touches none of `version-paths` -- a workflow, the documentation -- needs no bump, and
      # neither does one whose base has no version yet to bump from.
      env:
        VERSION_FILE: ${{ inputs.version-file }}
        VERSION_PATHS: ${{ inputs.version-paths }}
      run: |
        # The checkout of a pull request is the merge of its head into its base. Its first parent is
        # the base, so the pull request is exactly the difference between the two.
        if ! git rev-parse --quiet --verify HEAD^2 > /dev/null; then
          echo "This is not a merge checkout, so there is no base to compare the version against."
          exit 0
        fi

        # shellcheck disable=SC2086 # The paths are a list, to be split.
        CHANGED=$(git diff --name-only HEAD^1 HEAD -- ${VERSION_PATHS})
        if [ -z "${CHANGED}" ]; then
          echo "Nothing under ${VERSION_PATHS} changed, so the version does not need to."
          exit 0
        fi

        read_version() {
          python3 -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "$1"
        }
        BASE_FILE=$(mktemp)
        if ! git show "HEAD^1:${VERSION_FILE}" > "${BASE_FILE}" 2> /dev/null; then
          echo "The base has no ${VERSION_FILE} yet, so there is no version to bump from."
          exit 0
        fi
        BASE_VERSION=$(read_version "${BASE_FILE}")
        VERSION=$(read_version "${VERSION_FILE}")
        echo "Base version: ${BASE_VERSION}"
        echo "This version: ${VERSION}"
        if [ "${VERSION}" = "${BASE_VERSION}" ]; then
          echo "::error file=${VERSION_FILE}::The version is still ${BASE_VERSION}, but this pull request changes what the cache runs. Bump the version in ${VERSION_FILE}."
          echo "Changed:"
          echo "${CHANGED}" | sed 's/^/  /'
          exit 1
        fi
        echo "Version bumped from ${BASE_VERSION} to ${VERSION} ✓"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Work out the tags for this ref
      id: tags
      shell: bash
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # Not pushed; named only so the build step has something to label the result with.
          echo "list=${IMAGE}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
          echo "list=${IMAGE}:latest,${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        else
          # Slashes and other ref characters are not valid in a tag; flatten them.
          BRANCH=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_.-' '-')
          echo "list=${IMAGE}:dev-${BRANCH},${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        fi

    # Unconditional, including on pull requests: a cache image is built FROM the shared base on
    # ghcr, which is not anonymously pullable, so the build needs to authenticate to read it even
    # when it will not push the result. The push itself stays gated on the step below.
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.token }}

    # Built into the local daemon only. The checks below run against this image, and it is pushed
    # after they pass, so a tag on ghcr only ever names an image that passed them. Pushing here
    # instead would publish `:latest` before any check had run, leaving a failure to report on an
    # image every cache was already pulling.
    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        push: false
        load: true
        tags: ${{ steps.tags.outputs.list }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check the image carries the shared pipeline
      shell: bash
      # A cache image must be built FROM the dandi-cache-utils base, because the update extracts
      # the orchestration from it at run time. Catching a Dockerfile that is not leaves the failure
      # here rather than in the cache's next scheduled update.
      run: |
        IMAGE=$(printf '%s' "${{ steps.tags.outputs.list }}" | cut -d, -f1)
        SCRIPT=/opt/dandi-cache-utils/src/dandi_cache_utils/pipeline/update_pipeline.sh
        if ! docker run --rm "${IMAGE}" test -f "${SCRIPT}"; then
          echo "ERROR: ${IMAGE} does not carry /opt/dandi-cache-utils." >&2
          echo "Build it FROM ghcr.io/dandi-cache/dandi-cache-utils:latest (or :nwb)." >&2
          exit 1
        fi
        docker run --rm -v "$PWD":/repo:ro "${IMAGE}" \
          python -c "import dandi_cache_utils; dandi_cache_utils.read_config('/repo/cache.toml')"

    - name: Check this cache's own script against the library the image carries
      shell: bash
      # The two checks above prove the image and the configuration. Neither touches
      # `code/update.py`, which is the one file this repository actually contributes, so a script
      # calling a function the image's library does not have passed everything and failed at the
      # next scheduled update, on the real derivatives branch.
      #
      # An import would not catch it either: a name used inside a function body is resolved when
      # that function runs. `check-operations` reads the syntax tree instead, and covers every
      # operation the cache declares rather than only `update`.
      #
      # Needs a base image carrying dandi-cache-utils 0.1.8 or newer, which is what adopting this
      # version of the action means; the same was true of the description check in v2.
      run: |
        IMAGE=$(printf '%s' "${{ steps.tags.outputs.list }}" | cut -d, -f1)
        docker run --rm -v "$PWD":/repo:ro -w /repo "${IMAGE}" \
          dandi-cache check-operations

    - name: Check the committed description is what the configuration declares
      shell: bash
      # A cache commits the `dataset_description.json` it publishes, so that what it publishes is
      # readable without checking out a published branch. Generated, never hand-edited, so this
      # holds it to the `cache.toml` it came from rather than letting the two drift apart.
      #
      # A cache that commits no copy passes: the file is optional, and adopting it is what makes it
      # checked. That is what lets this step exist without every cache going red until it has one.
      run: |
        IMAGE=$(printf '%s' "${{ steps.tags.outputs.list }}" | cut -d, -f1)
        docker run --rm -v "$PWD":/repo:ro -w /repo "${IMAGE}" \
          dandi-cache dataset-description --check

    - name: Push
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      # The exact image the checks ran, by every tag this ref publishes.
      run: |
        IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.list }}"
        for TAG in "${TAGS[@]}"; do
          docker push "${TAG}"
        done

    - name: Notify on failure
      if: ${{ failure() && inputs.mail-username != '' }}
      uses: dawidd6/action-send-mail@v18
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ inputs.mail-username }}
        password: ${{ inputs.mail-password }}
        subject: "CI Failure: DANDI Cache: ${{ github.event.repository.name }} container build"
        to: ${{ inputs.notify-to }}
        from: DANDI Cache <dandi-cache@users.noreply.github.com>
        body: "Please check the latest container build of the DANDI Cache: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
