name: DANDI Cache Update
description: Run a DANDI cache's scheduled update, recording it with full DataLad provenance.
author: DANDI Cache

branding:
  icon: refresh-cw
  color: blue

# The update every cache in the organization runs on a schedule. A cache's own workflow keeps what
# is genuinely its own -- when it runs and what a manual dispatch can change -- and this does the
# rest: skipping a run that was overtaken while queued, building the runner's environment, pulling
# the cache's runtime image, extracting the shared pipeline from it, and running the update.
#
# The orchestration itself is not here either. It ships inside the `dandi_cache_utils` package,
# vendored in the cache's own runtime image, and is extracted from that image at run time -- so the
# image digest recorded in each run's provenance pins the pipeline and the runtime environment
# together, and a recorded run can be reproduced from the digest alone.

inputs:
  token:
    description: >-
      Token used to check out the repository, push the results, and read the runtime image from the
      container registry. Needs `contents: write` on the cache repository and `read:packages`.
    required: true
  operation:
    description: "Which entry point from the cache's [operations] table to run."
    required: false
    default: update
  testing:
    description: "Testing mode: process a handful of items into testing_-prefixed files, leaving the cache untouched."
    required: false
    default: "false"
  limit:
    description: "Cap on new items processed this run. Empty uses the operation's limit from cache.toml."
    required: false
    default: ""
  image:
    description: "Runtime image. Empty uses the image cache.toml declares for this cache."
    required: false
    default: ""
  chain:
    description: >-
      Queue the next run as soon as this one finishes when an update ends with backlog left: its
      batch was full and it recorded something new. "false" leaves the next run to the schedule.
    required: false
    default: "true"
  mail-username:
    description: "SMTP username for the failure notification. Leave empty to send no mail."
    required: false
    default: ""
  mail-password:
    description: "SMTP password for the failure notification."
    required: false
    default: ""
  notify-to:
    description: "Comma-separated recipients of the failure notification (no spaces)."
    required: false
    default: cody.c.baker.phd@gmail.com

outputs:
  ran:
    description: "`true` when the update ran, `false` when it was skipped as already done."
    value: ${{ steps.gate.outputs.should-run }}

runs:
  using: composite
  steps:
    # Runs are serialized by the caller's concurrency group, so a run triggered while another is
    # executing waits rather than being cancelled. It is redundant only if a run that *started*
    # after it was triggered has since succeeded: that run read everything this one would have. A
    # run that was already going when this one was triggered may have missed what arrived since,
    # and with a batch limit it certainly left the rest of the backlog, so the queued run goes
    # ahead. A run queued by the step that chains updates is one of those, and goes ahead too. A
    # failed run never counts, so the next one is always a fresh attempt.
    - name: Skip if a run started since this one was triggered has already succeeded
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        CREATED_AT=$(gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" --json createdAt --jq '.createdAt')
        # ISO 8601 UTC timestamps compare correctly as strings.
        COVERED_BY=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --status success --limit 20 --json startedAt \
          --jq "[.[] | select(.startedAt > \"${CREATED_AT}\")] | .[0].startedAt // empty")

        if [ -n "${COVERED_BY}" ]; then
          echo "A run that started at ${COVERED_BY}, after this one was triggered at ${CREATED_AT}, has succeeded; skipping."
          echo "should-run=false" >> "$GITHUB_OUTPUT"
        else
          echo "should-run=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout
      if: ${{ steps.gate.outputs.should-run == 'true' }}
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.token }}
        submodules: false

    - name: Install uv
      if: ${{ steps.gate.outputs.should-run == 'true' }}
      uses: astral-sh/setup-uv@v7

    - name: Install git-annex
      if: ${{ steps.gate.outputs.should-run == 'true' }}
      shell: bash
      # `|| true` on the update: third-party apt repositories preinstalled on the runner (Chrome's,
      # for one) intermittently fail to refresh, and that has nothing to do with the package we
      # need. The install itself is not tolerated, so a genuinely missing package still fails here.
      run: |
        sudo apt-get update || true
        sudo apt-get install -y git-annex

    - name: Log in to GitHub Container Registry
      if: ${{ steps.gate.outputs.should-run == 'true' }}
      shell: bash
      run: echo "${{ inputs.token }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

    - name: Resolve the runtime image
      if: ${{ steps.gate.outputs.should-run == 'true' }}
      id: image
      shell: bash
      run: |
        IMAGE="${{ inputs.image }}"
        if [ -z "${IMAGE}" ]; then
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest"
        fi
        echo "reference=${IMAGE}" >> "$GITHUB_OUTPUT"

    - name: Extract the shared pipeline from the image
      if: ${{ steps.gate.outputs.should-run == 'true' }}
      id: pipeline
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.reference }}
      run: |
        for attempt in 1 2 3 4 5; do
          if docker pull "${IMAGE}"; then
            break
          fi
          if [ "${attempt}" = 5 ]; then
            echo "ERROR: docker pull ${IMAGE} failed after ${attempt} attempts." >&2
            exit 1
          fi
          echo "WARNING: docker pull failed (attempt ${attempt}/5); retrying." >&2
          sleep "$((attempt * 5))"
        done

        CONTAINER=$(docker create "${IMAGE}")
        docker cp "${CONTAINER}:/opt/dandi-cache-utils" "${RUNNER_TEMP}/dandi-cache-utils"
        docker rm "${CONTAINER}" > /dev/null
        chmod +x "${RUNNER_TEMP}/dandi-cache-utils/src/dandi_cache_utils/pipeline/"*.sh
        echo "directory=${RUNNER_TEMP}/dandi-cache-utils" >> "$GITHUB_OUTPUT"

    - name: Run the update with provenance
      if: ${{ steps.gate.outputs.should-run == 'true' }}
      id: run
      shell: bash
      env:
        REPO_URL: https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}.git
        WORKSPACE: ${{ github.workspace }}
        IMAGE: ${{ steps.image.outputs.reference }}
        OPERATION: ${{ inputs.operation }}
        # "false" on a plain manual run and empty on a scheduled one; only "true" when testing mode
        # is explicitly selected.
        TESTING: ${{ inputs.testing }}
        LIMIT: ${{ inputs.limit }}
        GITHUB_SHA: ${{ github.sha }}
        DANDI_CACHE_UTILS_DIR: ${{ steps.pipeline.outputs.directory }}
        # The pipeline stages `dist` and the next step publishes it.
        PUBLISH_DIST: "false"
      run: bash "${{ steps.pipeline.outputs.directory }}/src/dandi_cache_utils/pipeline/update_pipeline.sh"

    # The staged directory holds exactly what the pipeline used to push itself: each declared output,
    # compressed, beside `dataset_description.json`. The `files` format publishes them as they are, as
    # the orphan branch's one commit, so every consumer URL stays what it was. It pushes with the
    # checkout's token, and leaves the branch alone when nothing in it changed.
    #
    # Nothing is staged when the run produced none of its declared outputs, and `dist` is then left
    # as it was.
    - name: Publish dist
      if: ${{ steps.gate.outputs.should-run == 'true' && steps.run.outputs.dist-directory != '' }}
      uses: CodyCBakerPhD/dist-bundle-action@v2
      with:
        root: ${{ steps.run.outputs.dist-directory }}
        paths: .
        format: files
        branch: dist
        commit-message: Publish ${{ github.event.repository.name }}

    # GitHub's scheduler delays and drops scheduled runs under load, so a cache with a backlog can
    # sit idle for hours between runs whatever its cron says. An update that ends with backlog left
    # therefore queues the next one itself: its batch was full, and it recorded something new, which
    # is what keeps a run that only re-fails the same items from chaining forever. It reads the
    # run's own log, whose two lines below are the library's report of the batch.
    #
    # Only `update` chains. A refresh re-assesses what is already recorded, so its batch is always
    # full and it would never stop. Nothing is queued if another run of this repository is already
    # waiting, since that one runs next anyway, and in a repository whose workflows share a
    # concurrency group a new pending run would cancel it. A dispatch that fails is a warning, not
    # a failed update: the schedule still runs the next one.
    - name: Queue the next run while a backlog remains
      if: ${{ steps.gate.outputs.should-run == 'true' && inputs.chain == 'true' && inputs.testing != 'true' && inputs.operation == 'update' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OPERATION: ${{ inputs.operation }}
        LIMIT: ${{ inputs.limit }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        LOG=$(ls -t "${RUNNER_TEMP}/derivatives-dataset/logs/${OPERATION}_"*.log 2>/dev/null | head -n 1 || true)
        if [ -z "${LOG}" ]; then
          echo "No ${OPERATION} log to read; leaving the next run to the schedule."
          exit 0
        fi
        BATCH=$(grep -oE 'Processing [0-9]+ items' "${LOG}" | tail -n 1 | grep -oE '[0-9]+' || true)
        NEW=$(grep -oE '\([0-9]+ new, ' "${LOG}" | tail -n 1 | grep -oE '[0-9]+' || true)
        if [ -z "${LIMIT}" ]; then
          LIMIT=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb")).get("operations", {}).get(sys.argv[2], {}).get("limit", ""))' \
            "${GITHUB_WORKSPACE}/cache.toml" "${OPERATION}")
        fi
        echo "Batch ${BATCH:-unknown} of limit ${LIMIT:-none}; ${NEW:-unknown} new."

        if [ -z "${BATCH}" ] || [ -z "${LIMIT}" ] || [ -z "${NEW}" ]; then
          echo "Not an incremental batch with a limit; leaving the next run to the schedule."
          exit 0
        fi
        if [ "${BATCH}" -lt "${LIMIT}" ]; then
          echo "The batch was not full, so the backlog is cleared."
          exit 0
        fi
        if [ "${NEW}" -eq 0 ]; then
          echo "A full batch recorded nothing new; not chaining a run that would repeat it."
          exit 0
        fi

        WAITING=$(gh run list --repo "${{ github.repository }}" --limit 50 --json status \
          --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
        if [ "${WAITING}" -gt 0 ]; then
          echo "${WAITING} run(s) of this repository already waiting; it runs next."
          exit 0
        fi

        WORKFLOW_FILE=$(basename "${WORKFLOW_REF%%@*}")
        if gh workflow run "${WORKFLOW_FILE}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"; then
          echo "Queued the next ${WORKFLOW_FILE} run: the backlog is not cleared."
        else
          echo "::warning::Could not queue the next run; the schedule will start it instead."
        fi

    # Inside the action rather than in every cache's workflow: an update that fails silently at
    # 03:00 is one nobody finds until a consumer notices stale data. Supplying no SMTP username
    # turns it off.
    - name: Notify on failure
      if: ${{ failure() && inputs.mail-username != '' }}
      uses: dawidd6/action-send-mail@v18
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ inputs.mail-username }}
        password: ${{ inputs.mail-password }}
        subject: "CI Failure: DANDI Cache: ${{ github.event.repository.name }} (${{ inputs.operation }})"
        to: ${{ inputs.notify-to }}
        from: DANDI Cache <dandi-cache@users.noreply.github.com>
        body: "Please check the latest run of the DANDI Cache ${{ inputs.operation }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
