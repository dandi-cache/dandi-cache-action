name: Move the major tag

# A cache pins `@v1`, not an exact version, so a published release reaches nobody until the major
# tag names it. Doing that by hand is the step that gets forgotten, and forgetting it is silent:
# every cache keeps running the tree the tag was last pointed at.
#
# It runs on a publish rather than on a push, so the moving tag still moves only when a release is
# deliberately published. What is automated here is the bookkeeping, not the decision.

on:
  release:
    types: [ published ]

jobs:
  MoveMajorTag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse a release the repository does not claim
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          DECLARED=$(tr -d '[:space:]' < VERSION)
          if [ "${TAG}" != "${DECLARED}" ]; then
            echo "::error::Released ${TAG}, but VERSION on this tree says ${DECLARED}." >&2
            echo "A release typed by hand can name a tree that was never prepared for it." >&2
            exit 1
          fi

      - name: Point the major tag at what was just released
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          MAJOR=${TAG%%.*}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "${MAJOR}" "${TAG}^{commit}" -m "${TAG}"
          git push --force origin "refs/tags/${MAJOR}"
          echo "\`${MAJOR}\` now points at \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"

  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [ MoveMajorTag ]
    if: ${{ always() && needs.MoveMajorTag.result == 'failure' }}

    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache Action major tag move"
          to: cody.c.baker.phd@gmail.com
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "A release was published but the major tag was not moved, so no cache has picked it up: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/move_major_tag.yml"
