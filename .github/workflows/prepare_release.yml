name: Prepare release draft

# A release cut by hand asks for a tag name, and the answer is already in the repository: `VERSION`.
# Typing it again is how `v1` came to be cut on a tree whose README still called the action by
# `@v0`.
#
# This keeps a draft release whose tag name and target are taken from `VERSION` and `main`, so
# releasing is opening the prepared draft and pressing Publish. The tag is created from the stored
# name, so there is nothing left to mistype.
#
# `Move the major tag` then follows the publish, because a cache pins `@v1` rather than an exact
# version. That is the one part this repository does differently from the pattern it borrows: a
# draft release cannot move a tag that already exists, so the moving tag cannot be the tag the
# draft names.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the tag this tree is published under
        id: resolve
        run: |
          TAG=$(tr -d '[:space:]' < VERSION)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "This tree is published as $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when that tag already exists
        id: released
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, so nothing is prepared. Bump VERSION to cut the next one." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the draft
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          NOTES="Actions published as \`$TAG\`. Publishing this moves \`${TAG%%.*}\`, which is what a cache pins."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
            echo "Updated the existing draft for $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
            echo "Created a draft for $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Nobody watches a draft that was never prepared, so a failure here is silent until the next
  # release is cut and the draft is missing.
  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [ Draft ]
    if: ${{ always() && needs.Draft.result == 'failure' }}

    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache Action release draft"
          to: cody.c.baker.phd@gmail.com
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "The release draft workflow failed, please check status at ${{ github.server_url }}/${{ github.repository }}/actions/workflows/prepare_release.yml"
