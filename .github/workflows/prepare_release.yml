name: Prepare release draft

# A release cut by hand asks for a tag name, and the answer is already in the repository: `VERSION`.
# Typing it again is how `v1` came to be cut on a tree whose README still called the action by
# `@v0`.
#
# This keeps a draft release whose tag name and target are taken from `VERSION` and `main`, so
# releasing is opening the prepared draft and pressing Publish. The tag is created from the stored
# name, so there is nothing left to mistype.
#
# The draft's target moves with every merge, which is the whole window in which a version is
# allowed to move. Publishing creates the tag and freezes it there. A released version is therefore
# never re-cut and never re-pointed: the next release is the next integer, and a cache pinned to an
# older one keeps running exactly the tree it was pinned to.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the tag this tree is published under
        id: resolve
        run: |
          TAG=$(tr -d '[:space:]' < VERSION)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "This tree is published as $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a version that has already been frozen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::${TAG} has been released, so it is frozen. Bump VERSION to cut the next one." >&2
            exit 1
          fi
          # A tag is created by publishing. One standing here before its release would silently win:
          # GitHub attaches a published release to an existing tag rather than pointing it at the
          # draft's target, so the release would name a tree nobody prepared.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} exists with no release behind it, so publishing would attach to it rather than to ${GITHUB_SHA}." >&2
            echo "Delete that tag, or bump VERSION." >&2
            exit 1
          fi

      - name: Write the notes from what has landed since the last release
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        # The changelog is GitHub's own, the same one the "Generate release notes" button writes,
        # rather than a `git log` reformatted here. It reads the pull requests between the two
        # points, so it says what changed rather than how it was committed.
        #
        # The bound is the last published release, since that is the last tree anyone could be
        # pinned to. Asking for it explicitly rather than letting the API default keeps this
        # correct if a prerelease is ever cut in between.
        run: |
          PREVIOUS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "${PREVIOUS}" ]; then
            CHANGELOG=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}" -f "previous_tag_name=${PREVIOUS}" --jq .body)
            echo "Changelog since ${PREVIOUS}." >> "$GITHUB_STEP_SUMMARY"
          else
            # No release yet, so there is no previous tree to compare against and GitHub reaches
            # back to the first commit.
            CHANGELOG=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}" --jq .body)
            echo "No previous release, so the changelog covers everything." >> "$GITHUB_STEP_SUMMARY"
          fi
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          printf '# %s\n\n%s\n' "${TAG}" "${CHANGELOG}" > "${NOTES_FILE}"
          echo "file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Prepare the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE"
            echo "Moved the draft for $TAG onto $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE"
            echo "Created a draft for $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Nobody watches a draft that was never prepared, so a failure here is silent until the next
  # release is cut and the draft is missing.
  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [ Draft ]
    if: ${{ always() && needs.Draft.result == 'failure' }}

    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache Action release draft"
          to: cody.c.baker.phd@gmail.com
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "The release draft workflow failed, please check status at ${{ github.server_url }}/${{ github.repository }}/actions/workflows/prepare_release.yml"
