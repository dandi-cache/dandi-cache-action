name: Move the version tag

# These actions are versioned by a single integer, and a cache pins that integer, so a release
# reaches nobody until the tag names the released tree.
#
# Publishing cannot do it. A draft holds no tag until it is published, and GitHub attaches a
# published release to a tag that already exists rather than moving it, so the tag would stay on
# whatever it named before. That is silent: every cache keeps running the tree the tag was last
# pointed at, and the release looks done.
#
# The commit comes from the release's target rather than from the tag, because the tag still names
# the previous tree at this point. Resolving the tag here would move it to itself.

on:
  release:
    types: [ published ]

jobs:
  MoveVersionTag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}

      - name: Refuse a release this tree does not claim
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          DECLARED=$(tr -d '[:space:]' < VERSION)
          if [ "${TAG}" != "${DECLARED}" ]; then
            echo "::error::Released ${TAG}, but VERSION on the released tree says ${DECLARED}." >&2
            echo "A release typed by hand can name a tree that was never prepared for it." >&2
            exit 1
          fi

      - name: Point the version tag at what was just released
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          COMMIT=$(git rev-parse "${TARGET}^{commit}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "${TAG}" "${COMMIT}" -m "${TAG}"
          git push --force origin "refs/tags/${TAG}"
          echo "\`${TAG}\` now points at \`${COMMIT}\`." >> "$GITHUB_STEP_SUMMARY"

  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [ MoveVersionTag ]
    if: ${{ always() && needs.MoveVersionTag.result == 'failure' }}

    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache Action version tag move"
          to: cody.c.baker.phd@gmail.com
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "A release was published but the version tag was not moved, so no cache has picked it up: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/move_version_tag.yml"
