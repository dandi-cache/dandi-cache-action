ci:
  autoupdate_schedule: quarterly

default_install_hook_types:
  - pre-commit

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.2
  hooks:
  - id: codespell

- repo: local
  hooks:
    - id: action-versions-agree
      name: action versions agree
      description: >-
        The references to this repository are written by hand, so this runs the test that catches
        them drifting from the tag `VERSION` names, at commit time rather than in CI.
      entry: pytest tests/test_actions.py --quiet
      language: python
      pass_filenames: false
      files: ^(VERSION|README\.md|action\.yml|[a-z-]+/action\.yml|tests/test_actions\.py)$
      additional_dependencies:
        - pytest
        - pyyaml
